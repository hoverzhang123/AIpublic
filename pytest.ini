[pytest]
# Test Discovery Configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Configuration
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage Configuration (when using pytest-cov)
# Note: Add --cov=src --cov-report=html when running tests to generate coverage reports

# Markers for categorizing tests
markers =
    unit: Unit tests (isolated, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow running tests
    requires_docker: Tests requiring Docker/Milvus
    requires_api: Tests requiring LLM API access

# Timeout (requires pytest-timeout)
# timeout = 300

# Logging Configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 7.0
